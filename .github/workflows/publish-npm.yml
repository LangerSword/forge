name: Publish Forge to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-forge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package metadata
        run: |
          test "$(node -p "require('./package.json').name")" = "@llangersword/forge"
          test "$(node -p "require('./package.json').version")" != "0.1.0"
          node --check bin/forge-evidence-site.js

      - name: Install and build
        run: npm ci --registry=https://registry.npmjs.org && npm run build

      - name: Run package smoke test
        run: |
          npm pack --dry-run
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
