name: Deploy Forge evidence site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web.js"
      - "vercel.json"
      - ".github/workflows/deploy-forge-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build static package
        working-directory: web
        run: npm run build

      - name: Verify package contents
        working-directory: web
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/docs/index.html
          test -f dist/docs/installation.html
          test -f dist/docs/architecture.html
          test -f dist/docs/cli.html
          test -f dist/support/index.html
          test -f dist/assets/forge-loop.svg
          test -f dist/assets/c0-evidence.svg
          node --check app.js

      - name: Check Vercel credentials
        id: vercel_credentials
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" && -n "$VERCEL_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel deployment skipped: configure VERCEL_ORG_ID, VERCEL_PROJECT_ID, and VERCEL_TOKEN repository secrets."
          fi

      - name: Pull Vercel project settings
        if: steps.vercel_credentials.outputs.configured == 'true'
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel build output
        if: steps.vercel_credentials.outputs.configured == 'true'
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to Vercel
        if: steps.vercel_credentials.outputs.configured == 'true'
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
